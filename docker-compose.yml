version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-transit-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: karnataka_transit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-transit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  transit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-transit-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgrespassword2026@postgres:5432/karnataka_transit_db?schema=public
      - REDIS_URL=redis://redis:6379
      - ACTIVE_KEY_ID=2026-Q3-PRIMARY
      - TRANSIT_TOKEN_SECRET=ksrtc_secure_smart_transit_secret_key_prod_v2_9f83a04c
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
